        text: 'ACME offices are located in:'
        upperEndpoint: Very easy
    WorkspaceStudy:
      properties:
        cursor:
          description: Pagination cursor for this study entry.
          type: string
          example: MQ
        orderedAt:
          description: Timestamp when the study was ordered or created in the workspace (UTC, ISO 8601).
          format: date-time
          type: string
          example: '2023-11-30T11:07:16Z'
        orderedBy:
          properties:
            email:
              type: string
              description: Email of the user who ordered or created the study.
              example: support@usertesting.com
            name:
              type: string
              description: Name of the user who ordered or created the study.
              example: UT Employee
          type: object
          description: User information for the person who ordered or created the study.
          example:
            email: support@usertesting.com
            name: UT Employee
        productType:
          type: string
          description: Describes the product/business category of the study — what kind of research it
            is. It determines behavior like recording settings, test plan requirements, and audience configuration.
            Also indicates API endpoint version compatibility. For example:<br/>INSIGHT_CORE – the default
            for classic studies/tests (v1)<br/>PRODUCT_INSIGHT – product-focused quick test (v1)<br/>MARKET_INSIGHT
            – market research-focused test (v1)<br/>THINK_OUT_LOUD – screen+audio recorded, no webcam
            (v2)<br/>LIVE_CONVERSATION – live moderated session (v2)<br/>NON_THINK_OUT_LOUD – unmoderated
            without think-aloud (v2)<br/>STUDY_VIDEO_UPLOAD – uploaded video study (not API accessible)
          example: insight_core
        title:
          type: string
          description: Human-readable title of the study.
          example: ACME Test
        type:
          type: string
          description: 'Describes the technical format / delivery mechanism of the study — how the test
            is conducted. Also used to indicate API endpoint version compatibility. For example: <br/>WEB
            – browser-based website test (v1)<br/>APP – mobile application test (v1)<br/>LIVE – live moderated
            conversation (v1)<br/>PROTOTYPE – clickable prototype test (v1)<br/>EXTERNAL_UPLOAD – externally
            recorded video uploaded into the platform<br/>STUDYV2 – newer study/test format (v2 & v3)<br/>STUDY_VIDEO_UPLOAD
            – uploaded video study (not API accessible)'
          example: web
        uuid:
          type: string
          description: Unique UUID of the study (test).
          example: ef333003-697b-4add-b19a-8e8e37f8d8b8
      type: object
      example:
        cursor: MQ
        orderedAt: '2023-11-30T11:07:16Z'
        orderedBy:
          email: support@usertesting.com
          name: UT Employee
        productType: insight_core
        title: ACME Test
        type: web
        uuid: ef333003-697b-4add-b19a-8e8e37f8d8b8
