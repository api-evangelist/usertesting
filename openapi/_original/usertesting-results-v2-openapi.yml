        image:
          type: object
          nullable: true
          description: Displays an image in the study. Common in survey-style workflows.
        nps:
          type: object
          nullable: true
          description: Captures Net Promoter Score (0-10).
        url:
          type: object
          nullable: true
          description: Opens an external URL.
        rankOrder:
          type: object
          nullable: true
          description: 'Users rank options (for example: Chocolate, Strawberry, Vanilla, Mint Chocolate).'
        written:
          type: object
          nullable: true
          description: Captures spoken responses (think-aloud).
        figma:
          type: object
          nullable: true
          description: Embeds interactive Figma prototypes. Metadata includes prototypeUrl, figmaPrototypeTitle,
            and figmaPrototypeDisplaySetting.
        matrix:
          type: object
          nullable: true
          description: Grid-style question for rating multiple items.
    TaskResponseDataDto:
      type: object
      properties:
        startTimeMs:
          type: number
          description: Task start time (ms since session start).
          example: 15000
        endTimeMs:
          type: number
          description: Task end time (ms since session start).
          example: 20000
        skipped:
          type: boolean
          description: Whether the participant skipped the task.
          example: false
        answer:
          description: Task-type-specific answer payload.
          nullable: true
          allOf:
          - $ref: '#/components/schemas/TaskAnswerDto'
      required:
      - startTimeMs
      - endTimeMs
      - skipped
      - answer
    TaskItemDto:
      type: object
      properties:
        uuid:
          type: string
          description: ID of the task.
          format: uuid
          example: 12debc51-0948-4d2e-9abe-9844ddd5c5ff
        text:
          type: string
          description: Task prompt text.
          example: Rate Website A
        type:
          type: string
          description: "Type of the task.\n  \n  - BLANK: Simple placeholder task. Baseline for test creation.\n\
            \  - RATING_SCALE: Likert-style rating scales.\n  - MULTIPLE_CHOICE: Supports single-select\
            \ and multi-select options. Includes multiSelect, randomizedOptions, and maxLimit metadata\
            \ when available.\n  - IMAGE: Displays an image in the study. Common in survey-style workflows.\n\
            \  - NPS: Captures Net Promoter Score (0-10).\n  - URL: Opens an external URL.\n  - RANK_ORDER:\
            \ Users rank options (for example: Chocolate, Strawberry, Vanilla, Mint Chocolate).\n  - WRITTEN:\
            \ Captures spoken responses (think-aloud).\n  - FIGMA: Embeds interactive Figma prototypes.\
            \ Metadata includes prototypeUrl, figmaPrototypeTitle, and figmaPrototypeDisplaySetting.\n\
            \  - MATRIX: Grid-style question for rating multiple items."
          enum:
