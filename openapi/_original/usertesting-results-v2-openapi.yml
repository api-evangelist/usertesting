          maximum: 100
          nullable: true
          example: null
        components:
          description: The behavioral and attitudinal QXscore components used to calculate the overall
            QXscore.
          allOf:
          - $ref: '#/components/schemas/QxScoreComponentsDto'
        values:
          description: Detailed QXscore subcomponent values obtained from session (participant) averages
            used to calculate the behavioral and attitudinal components.
          allOf:
          - $ref: '#/components/schemas/QxScoreValuesDto'
      required:
      - taskGroupId
      - label
      - qxScore
      - components
      - values
    QxScoreMetaDto:
      type: object
      properties:
        totalQxTasks:
          type: number
          description: Total number of QX task groups.
          example: 1
        completes:
          type: number
          description: Number of completed sessions.
          example: 2
      required:
      - totalQxTasks
      - completes
    QxScoreResponseApi:
      type: object
      properties:
        testId:
          type: string
          description: UUID of the test.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        qxScores:
          description: List of QXscore results for each QX task group within the test.
          type: array
          items:
            $ref: '#/components/schemas/QxScoreItemDto'
        meta:
          description: Metadata about the QXscore calculation.
          allOf:
          - $ref: '#/components/schemas/QxScoreMetaDto'
      required:
      - testId
      - qxScores
      - meta
    ReelDetailsResponseDto:
      type: object
      properties:
        reelId:
          type: string
          description: ID of the highlight reel.
          format: uuid
          example: 8fdc898f-3b2b-4f45-91a2-2a6b618bc987
        status:
          type: string
          description: 'Current state of the highlight reel.

            - `GENERATING`: the highlight reel is being prepared. Try again in a few seconds.

            - `GENERATED`: the highlight reel is ready and `reelUrl` contains the download link.

            - `ERROR`: something went wrong while preparing the highlight reel. Try the request again
            to start a new attempt.'
          enum:
          - GENERATING
          - GENERATED
          - ERROR
          example: GENERATED
        reelUrl:
          type: string
          description: Link to download the highlight reel file. Valid for 15 minutes. Returned only when
            the status is `GENERATED`; call this endpoint again to get a new link after it expires.
          format: url
          nullable: true
