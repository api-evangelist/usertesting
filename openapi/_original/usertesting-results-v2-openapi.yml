          example: null
          type: array
          items:
            type: number
        usability:
          type: number
          description: Represents the usability score used to calculate the attitudinal component.
          minimum: 0
          maximum: 100
          example: 50
        trust:
          type: number
          description: Represents the trust score used to calculate the attitudinal component.
          minimum: 0
          maximum: 100
          example: 50
        appearance:
          type: number
          description: Represents the appearance score used to calculate the attitudinal component.
          minimum: 0
          maximum: 100
          example: 50
        loyalty:
          type: number
          description: Represents the loyalty score used to calculate the attitudinal component.
          minimum: 0
          maximum: 100
          example: 50
      required:
      - behavioral
      - usability
      - trust
      - appearance
      - loyalty
    QxScoreItemDto:
      type: object
      properties:
        taskGroupId:
          type: string
          description: UUID of a QX task group within the test that contains a set of navigational tasks
            and questions used to measure to the QXscore.
          example: b1e2c3d4-5678-1234-9abc-def012345678
        label:
          type: string
          description: Label for the QX task group.
