aid: usertesting
name: UserTesting
description: >-
  UserTesting is a human insight platform for experience research: teams recruit vetted
  participants, run usability tests, surveys, live conversations, and interaction tests, and
  analyze session videos, transcripts, and QXscore experience metrics. Its developer surface at
  developer.usertesting.com exposes the Results API (v2) for programmatic access to session data,
  videos, transcripts, clips, highlight reels, and QXscores, plus Legacy (v1) endpoints for
  embedding content from classic tests. Authentication is OAuth 2.0 client credentials issued
  against its Okta authorization server, and an official MCP server (early access) connects the
  platform to Claude, ChatGPT, Figma Make, and other AI clients.
